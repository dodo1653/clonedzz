<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { width: 512px; height: 512px; background: transparent; }
      .tile {
        position: relative; width: 512px; height: 512px; overflow: hidden;
        border-radius: 110px;
        background:
          radial-gradient(360px 320px at 50% -4%, rgba(122, 192, 142, 0.4), transparent 70%),
          radial-gradient(280px 240px at 88% 94%, rgba(224, 176, 110, 0.45), transparent 72%),
          linear-gradient(160deg, #f2e6cf 0%, #e3cba4 45%, #cda274 100%);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.28), 0 20px 48px rgba(84, 62, 32, 0.32);
        display: grid; place-items: center;
      }
      .tile::before {
        content: ''; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 250, 240, 0.13) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 250, 240, 0.13) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 25%, transparent 78%);
        mask-image: radial-gradient(circle at 50% 46%, #000 25%, transparent 78%);
      }
      /* warm dark vignette right behind the wordmark so the cream text pops */
      .glow {
        position: absolute; top: 50%; left: 50%; width: 470px; height: 470px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(96, 62, 28, 0.5) 0%, rgba(96, 62, 28, 0.22) 46%, transparent 72%);
      }
      .orbit { position: absolute; top: 50%; left: 50%; width: 316px; height: 316px; transform: translate(-50%, -52%); border: 1.5px solid rgba(253, 247, 234, 0.55); border-radius: 50%; }
      .orbit::before { content: ''; position: absolute; inset: 22px; border: 1px solid rgba(253, 247, 234, 0.3); border-radius: 50%; }
      .orbit-dot { position: absolute; top: -13px; left: 50%; width: 26px; height: 26px; transform: translateX(-50%); border-radius: 50%; background: #bfe6c9; box-shadow: 0 0 24px rgba(191, 230, 201, 0.95), 0 0 60px rgba(191, 230, 201, 0.45); }
      .stack { position: relative; display: grid; justify-items: center; gap: 20px; }
      .wordmark {
        display: flex; align-items: baseline; font-family: 'Playfair Display', Georgia, serif;
        font-style: italic; font-weight: 500; font-size: 104px; letter-spacing: -0.05em; line-height: 1;
        color: #fdf7ea; text-shadow: 0 2px 16px rgba(70, 45, 20, 0.55), 0 1px 2px rgba(70, 45, 20, 0.4);
      }
      .wordmark em { font-style: italic; color: #c9e9d2; text-shadow: 0 0 34px rgba(191, 230, 201, 0.6), 0 2px 14px rgba(70, 45, 20, 0.5); }
      .tagline { font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 0.5em; color: rgba(255, 250, 240, 0.8); text-indent: 0.5em; text-shadow: 0 1px 6px rgba(70, 45, 20, 0.5); }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="glow"></div>
      <div class="orbit"><div class="orbit-dot"></div></div>
      <div class="stack">
        <div class="wordmark">clone<em>dzz</em></div>
        <div class="tagline">REPLICATE</div>
      </div>
    </div>
  </body>
</html>
