<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { width: 512px; height: 512px; background: transparent; }
      .tile {
        position: relative; width: 512px; height: 512px; overflow: hidden;
        border-radius: 110px;
        background:
          radial-gradient(360px 320px at 50% -4%, rgba(183, 228, 199, 0.17), transparent 70%),
          radial-gradient(280px 240px at 88% 94%, rgba(167, 204, 255, 0.09), transparent 72%),
          linear-gradient(160deg, #15181e 0%, #0b0c0f 55%, #07080b 100%);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        display: grid; place-items: center;
      }
      .tile::before {
        content: ''; position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 25%, transparent 78%);
        mask-image: radial-gradient(circle at 50% 46%, #000 25%, transparent 78%);
      }
      .orbit { position: absolute; top: 50%; left: 50%; width: 330px; height: 330px; transform: translate(-50%, -50%); border: 1.5px solid rgba(183, 228, 199, 0.32); border-radius: 50%; }
      .orbit::before { content: ''; position: absolute; inset: 22px; border: 1px solid rgba(183, 228, 199, 0.14); border-radius: 50%; }
      .orbit-dot { position: absolute; top: -13px; left: 50%; width: 26px; height: 26px; transform: translateX(-50%); border-radius: 50%; background: #b7e4c7; box-shadow: 0 0 24px rgba(183, 228, 199, 0.95), 0 0 60px rgba(183, 228, 199, 0.4); }
      .stack { position: relative; display: grid; justify-items: center; gap: 22px; }
      .wordmark { display: flex; align-items: baseline; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; font-size: 78px; letter-spacing: -0.045em; line-height: 1; color: #f0efe9; text-shadow: 0 2px 30px rgba(0, 0, 0, 0.55); }
      .wordmark em { font-style: italic; color: #b7e4c7; text-shadow: 0 0 34px rgba(183, 228, 199, 0.45); }
      .tagline { font-family: 'DM Mono', monospace; font-size: 14px; letter-spacing: 0.5em; color: rgba(240, 239, 233, 0.6); text-indent: 0.5em; }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="orbit"><div class="orbit-dot"></div></div>
      <div class="stack">
        <div class="wordmark">clone<em>dzz</em></div>
        <div class="tagline">REPLICATE</div>
      </div>
    </div>
  </body>
</html>
